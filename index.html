        select.id=`reactivity-${group}`;
        select.className='mini-select';
        const label=document.createElement('label');
        label.className='sr-only';
        label.htmlFor=select.id;
        label.textContent=`Reactivity for group ${group}`;
        [['','—'],['VR','VR'],['UR','UR']].forEach(([value,text])=>{
          const option=document.createElement('option');
          option.value=value;
          option.textContent=text;
          select.appendChild(option);
        });
        head.append(label,select);
      }
      head.appendChild(button);
      place(head,1,group+1);
    }

    for(let period=1;period<=7;period++){
      const input=document.createElement('input');
      input.id=`period-${period}`;
      input.type='text';
      input.inputMode='numeric';
      input.maxLength=1;
      input.autocomplete='off';
      input.placeholder='?';
      input.className='period-input';
      input.setAttribute('aria-label',`Type the period number for the row containing ${elements.find(el=>el.period===period).name}`);
      input.addEventListener('input',()=>input.removeAttribute('aria-invalid'));
      place(input,period+1,1);
    }
    [['Lanthanides',10],['Actinides',11]].forEach(([text,row])=>{
      const node=document.createElement('div');
      node.className='series-label';
      node.textContent=text;
      place(node,row,1);
    });
    for(const el of elements){
      const tile=document.createElement('button');
      tile.type='button';
      tile.className='element';
      tile.dataset.number=String(el.number);
      tile.innerHTML=`<span class="num">${el.number}</span><span class="symbol">${el.symbol}</span><span class="name">${el.name}</span>`;
      tile.setAttribute('aria-label',`${el.name}, ${el.symbol}, atomic number ${el.number}. Click to color.`);
      tile.title=`${el.name} (${el.symbol}) · atomic number ${el.number}`;
      const detached=el.category==='lanthanide'||el.category==='actinide';
      const row=detached?(el.category==='lanthanide'?10:11):el.period+1;
      const column=detached?4+el.number-(el.category==='lanthanide'?57:89):el.group+1;
      place(tile,row,column);
    }
    [[7,'57–71'],[8,'89–103']].forEach(([row,text])=>{
      const note=document.createElement('div');
      note.className='series-label rounded border border-dashed border-slate-300 bg-white text-slate-500';
      note.textContent=text;
      place(note,row,4);
    });

    function setSelected(category){
      selected=category;
      document.querySelectorAll('.swatch').forEach(button=>{
        const active=button.dataset.category===category;
        button.classList.toggle('active',active);
        button.setAttribute('aria-pressed',String(active));
      });
      document.getElementById('eraser').setAttribute('aria-pressed',String(category===''));
    }
    function paint(tile){
      if(selected) tile.dataset.color=selected;
      else delete tile.dataset.color;
    }
    document.getElementById('palette').addEventListener('click',event=>{
      const button=event.target.closest('[data-category]');
      if(button) setSelected(button.dataset.category);
    });
    document.getElementById('eraser').addEventListener('click',()=>setSelected(''));
    grid.addEventListener('pointerdown',event=>{
      const tile=event.target.closest('.element');
      if(!tile) return;
      painting=true;
      paint(tile);
    });
    grid.addEventListener('pointerover',event=>{
      if(!painting||event.pointerType==='touch') return;
      const tile=event.target.closest('.element');
      if(tile) paint(tile);
    });
    window.addEventListener('pointerup',()=>painting=false);
    grid.addEventListener('click',event=>{
      if(event.detail!==0) return;
      const tile=event.target.closest('.element');
      if(tile) paint(tile);
    });

    document.getElementById('check-work').addEventListener('click',()=>{
      const correctColors=elements.filter(el=>grid.querySelector(`[data-number="${el.number}"]`).dataset.color===el.category).length;
      const groups=[...grid.querySelectorAll('.group-button')].filter(button=>button.classList.contains('marked')).length;
      let correctPeriods=0;
      for(let period=1;period<=7;period++){
        const input=document.getElementById(`period-${period}`);
        const correct=input.value.trim()===String(period);
        if(correct) correctPeriods++;
        input.setAttribute('aria-invalid',String(!correct));
      }
      const correctValence=Object.entries(valence).filter(([group,answer])=>document.getElementById(`valence-${group}`).value.trim()===String(answer)).length;
      const reactions={1:'VR',17:'VR',18:'UR'};
      const correctReactivity=Object.entries(reactions).filter(([group,answer])=>document.getElementById(`reactivity-${group}`).value===answer).length;
      const score=10*correctColors/118+2*(groups+correctPeriods)/25+2*correctValence/8+correctReactivity/3;
      const feedback=document.getElementById('feedback');
      feedback.replaceChildren();
      const title=document.createElement('p');
      title.className='font-bold';
      title.style.fontSize='20px';
      title.textContent=`Score: ${score.toFixed(1)} / 15 points`;
      const detail=document.createElement('p');
      detail.className='mt-2 leading-relaxed';
      detail.textContent=`Part 1: ${correctColors}/118 elements correct · Part 2: ${groups}/18 groups circled and ${correctPeriods}/7 period numbers correct · Part 3: ${correctValence}/8 valence counts correct · Part 4: ${correctReactivity}/3 reactivity labels correct.`;
      const hint=document.createElement('p');
      hint.className='mt-2 text-slate-600';
      hint.textContent=correctColors===118&&groups===18&&correctPeriods===7&&correctValence===8&&correctReactivity===3
        ? 'Excellent work — every part is complete!'
        : 'Review your colors and annotations. Type each period number in the box beside its row, then check again.';
      feedback.append(title,detail,hint);
      feedback.classList.remove('hidden');
    });

    const confirmation=document.getElementById('clear-confirmation');
    document.getElementById('clear-work').addEventListener('click',()=>confirmation.classList.remove('hidden'));
    document.getElementById('cancel-clear').addEventListener('click',()=>confirmation.classList.add('hidden'));
    document.getElementById('confirm-clear').addEventListener('click',()=>{
      grid.querySelectorAll('.element').forEach(tile=>delete tile.dataset.color);
      grid.querySelectorAll('.group-button').forEach(button=>{
        button.classList.remove('marked');
        button.setAttribute('aria-pressed','false');
      });
      grid.querySelectorAll('input').forEach(input=>{
        input.value='';
        input.removeAttribute('aria-invalid');
      });
      grid.querySelectorAll('select').forEach(select=>select.value='');
      document.getElementById('feedback').classList.add('hidden');
      confirmation.classList.add('hidden');
      setSelected('alkali');
    });
    setSelected('alkali');
  </script>
 </body>
</html>
